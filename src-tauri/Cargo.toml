[package]
name = "miao-secretary"
version = "1.0.0"
description = "喵秘书 - 微信群通知智能整理助手"
authors = ["肥猫叉烧"]
license = "MIT"
repository = "https://gitee.com/fat-cat-barbecue/miao-secretary"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "miao_secretary_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-dialog = "2.0.3"
tauri-plugin-fs = "2.0.3"
tauri-plugin-shell = "2.0.3"
tauri-plugin-sql = { version = "2.0.3", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri-plugin-log = "2.0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }

[features]
# default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
